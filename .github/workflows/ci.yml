name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-x86_64-unknown-linux-gnu-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-x86_64-unknown-linux-gnu-cargo-

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Rust tests
        run: cargo test

      - name: Build Rust binary
        run: cargo build --release --bin unqimages-core

      - name: Upload binary for TS tests
        uses: actions/upload-artifact@v4
        with:
          name: unqimages-core-ci
          path: target/release/unqimages-core
          if-no-files-found: error
          retention-days: 1

  typescript:
    name: TypeScript checks
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache TypeScript build outputs
        uses: actions/cache@v4
        with:
          path: |
            packages/*/dist
            packages/*/*.tsbuildinfo
            scripts/*.tsbuildinfo
          key: ts-${{ hashFiles('**/tsconfig.json') }}-${{ github.run_id }}
          restore-keys: |
            ts-${{ hashFiles('**/tsconfig.json') }}-

      - name: Install dependencies
        run: pnpm install

      - name: Download Rust binary
        uses: actions/download-artifact@v4
        with:
          name: unqimages-core-ci
          path: target/release

      - name: Make binary executable
        run: chmod +x target/release/unqimages-core

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test
